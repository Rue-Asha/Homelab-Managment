---
# /dev/net/tun passthrough is a HOST-level concern: it writes raw lxc.* keys
# into /etc/pve/lxc/<ctid>.conf on the Proxmox node, which the Terraform
# provider cannot express (no escape hatch for arbitrary lxc.* config). It used
# to run as part of 01_PROVISIONING; with provisioning moved to Terraform it
# needs a home, and it belongs here rather than in the tailscale app role --
# host concerns stay out of service roles. Its own play, delegated to the node,
# keeps that boundary visible.
#
# It must run BEFORE the service: an unprivileged container has no TUN device,
# and tailscaled cannot start without one.
- name: Ensure /dev/net/tun is passed through to the container
  hosts: tailscale
  gather_facts: false
  roles:
    - proxmox_lxc_tun

- name: Configure the Tailscale subnet router
  hosts: tailscale
  become: true
  gather_facts: true
  roles:
    - common     # base host config (02 layer)
    - tailscale  # install + IP forwarding + advertise the LAN route
