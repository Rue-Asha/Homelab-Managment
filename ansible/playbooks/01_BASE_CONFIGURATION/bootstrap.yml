---
# Baseline configuration for a guest created from the homelab template.
#
# The template already carries the ansible user, its sudo rule and the guest and
# deploy public keys, so a fresh guest is reachable the moment it boots. This
# playbook converges the authorised keys from ansible/keys/ (exclusive, so it is
# also how a rotated key reaches existing guests and how the deploy key leaves
# runner01) and applies `common`. Safe to re-run.
#
#   ansible-playbook ansible/playbooks/01_BASE_CONFIGURATION/bootstrap.yml -l <host>
#
# Re-keying guests without locking yourself out: authorise the old key for one
# run, then switch ansible.cfg to the new key and run again without it.
#
#   ansible-playbook ... -e '{"guest_bootstrap_extra_public_keys": ["<old pub>"]}' \
#     --private-key ~/.ssh/<old key>

- name: Converge the baseline on guests
  hosts: proxmox_guest
  become: true
  roles:
    - guest_bootstrap
    - common
