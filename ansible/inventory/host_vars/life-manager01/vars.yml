---
# --- life_manager service (03_SERVICES) ---
life_manager_version: v0.1.0
# Rollback proof (cd-homelab 9.4): a path the app 404s on fails the smoke check.
life_manager_smoke_url: http://127.0.0.1/rollback-proof-404
life_manager_smoke_headers:
  Host: "{{ nginx_server_name }}"

common_timezone: Europe/Berlin

# --- nginx reverse proxy in front of the service ---
nginx_reverse_proxy_enabled: true
nginx_backend_host: 127.0.0.1
nginx_backend_port: "{{ life_manager_port }}"
nginx_service_description: "the Life Manager web service"
