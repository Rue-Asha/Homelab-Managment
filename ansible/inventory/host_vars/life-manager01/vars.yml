---
# --- life_manager service (02_SERVICES) ---
life_manager_version: v0.7.0
life_manager_smoke_headers:
  Host: "{{ nginx_server_name }}"
life_manager_proton_enabled: true

common_timezone: Europe/Berlin

# --- nginx reverse proxy in front of the service ---
nginx_reverse_proxy_enabled: true
nginx_backend_host: 127.0.0.1
nginx_backend_port: "{{ life_manager_port }}"
nginx_service_description: "the Life Manager web service"

# --- sqlite backups (roles/sqlite_snapshot, roles/sqlite_backup, 00_OPERATIONAL/sqlite_restore.yml) ---
sqlite_backups:
  service: life-manager
  unit: life-manager.service
  owner: life-manager
  group: life-manager
  mode: "0640"
  release_link: /opt/life-manager/current
  healthz_url: http://127.0.0.1/healthz
  databases:
    - /var/lib/life-manager/life-manager.db
