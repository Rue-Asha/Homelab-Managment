---
# --- creative_archive service (02_SERVICES) ---
creative_archive_version: v0.1.3
creative_archive_smoke_headers:
  Host: "{{ nginx_server_name }}"

common_timezone: Europe/Berlin

# --- nginx reverse proxy in front of the service ---
nginx_reverse_proxy_enabled: true
nginx_backend_host: 127.0.0.1
nginx_backend_port: "{{ creative_archive_port }}"
nginx_server_aliases:
  - creative.home.arpa
nginx_service_description: "the Creative Archive web service"
# Photo uploads go up to 16 MB; nginx's default 10m would answer 413 before the app (BODY_SIZE_LIMIT 17M) decides.
nginx_client_max_body_size: 18m

# --- sqlite backups (roles/sqlite_snapshot, roles/sqlite_backup, 00_OPERATIONAL/sqlite_restore.yml) ---
sqlite_backups:
  service: creative-archive
  unit: creative-archive.service
  owner: creative-archive
  group: creative-archive
  mode: "0640"
  release_link: /opt/creative-archive/current
  healthz_url: http://127.0.0.1/healthz
  databases:
    - /var/lib/creative-archive/creative-archive.db
