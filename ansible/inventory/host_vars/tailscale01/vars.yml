---
# --- host-level (Proxmox node) ---
# Sizing, vmid and address live in terraform/environments/homelab/hosts.auto.tfvars.
# Tailscale needs /dev/net/tun, which an unprivileged LXC lacks by default.
# This flag makes the tailscale playbook add the passthrough to the container's
# Proxmox config on the host (roles/proxmox_lxc_tun). Host-level concern — it
# deliberately lives outside the tailscale app role.
proxmox_lxc_tun_enabled: true

# --- tailscale subnet router (03_SERVICES) ---
# Advertise the flat LAN so remote tailnet devices can reach 192.168.0.x.
# IP-only access: DNS is not accepted from the tailnet.
tailscale_advertise_routes: 192.168.0.0/24
tailscale_accept_dns: false

# Pre-auth key (tailscale_authkey) is in the adjacent vault.yml.
