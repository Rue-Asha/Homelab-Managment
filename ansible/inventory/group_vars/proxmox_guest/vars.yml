---
# Terraform owns guest identity: vmid, IP, hostname, and group membership come
# from the generated inventory (ansible/inventory/00-terraform.yml). What is
# left here is what roles/proxmox_lxc_tun needs to reach the Proxmox node --
# the one host-level concern the Terraform provider cannot express.

# Inventory name of the Proxmox node, used as a delegate_to target.
proxmox_node_ip: proxmox1
