---
- name: Create container if missing
  community.proxmox.proxmox:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs | default(false) }}"
    node: "{{ proxmox_node_name }}"
    vmid: "{{ lxc_ctid }}"
    hostname: "{{ lxc_hostname | default(inventory_hostname) }}"
    ostemplate: "{{ lxc_ostemplate | trim }}"
    password: "{{ lxc_password | default(omit) }}"
    pubkey: "{{ lxc_ssh_public_key | default(omit) }}"
    disk: "{{ lxc_rootfs_storage }}:{{ lxc_disk_gb }}"
    cores: "{{ lxc_cores }}"
    memory: "{{ lxc_memory }}"
    swap: "{{ lxc_swap | default(512) }}"
    unprivileged: "{{ lxc_unprivileged | default(true) }}"
    netif:
      net0: "name=eth0,bridge={{ lxc_bridge }}{% if lxc_vlan is defined %},tag={{ lxc_vlan }}{% endif %},ip={{ ansible_host }}/{{ lxc_cidr }},gw={{ lxc_gateway }}"
    onboot: "{{ lxc_onboot | default(true) }}"
    state: present
  when: not lxc_exists
  delegate_to: localhost
