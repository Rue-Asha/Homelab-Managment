---
- name: Install the systemd unit for the service
  ansible.builtin.template:
    src: rues-arcade.service.j2
    dest: "/etc/systemd/system/{{ rues_arcade_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart rues-arcade

- name: Ensure the service is enabled and running
  ansible.builtin.systemd:
    name: "{{ rues_arcade_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
