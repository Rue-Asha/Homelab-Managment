---
- name: Ensure the rues-arcade group exists
  ansible.builtin.group:
    name: "{{ rues_arcade_group }}"
    system: true
    state: present

- name: Ensure the rues-arcade service user exists
  ansible.builtin.user:
    name: "{{ rues_arcade_user }}"
    group: "{{ rues_arcade_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ rues_arcade_data_dir }}"
    create_home: false
    state: present
