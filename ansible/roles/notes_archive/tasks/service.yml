---
- name: Install the systemd unit for the service
  ansible.builtin.template:
    src: notes-archive.service.j2
    dest: "/etc/systemd/system/{{ notes_archive_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart notes-archive

- name: Ensure the service is enabled and running
  ansible.builtin.systemd:
    name: "{{ notes_archive_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
