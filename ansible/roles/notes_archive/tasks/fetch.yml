# SPDX-License-Identifier: MIT-0
---
# Idempotency: a release is only fetched and activated when the requested
# version differs from the one currently live. The live version is recorded in
# a marker file inside the active release.
- name: Read the currently deployed version marker
  ansible.builtin.slurp:
    src: "{{ notes_archive_current_link }}/.deployed_version"
  register: notes_archive_deployed_marker
  changed_when: false
  failed_when: false

- name: Determine the currently deployed version
  ansible.builtin.set_fact:
    notes_archive_deployed_version: >-
      {{ (notes_archive_deployed_marker['content'] | b64decode | trim)
         if (notes_archive_deployed_marker['content'] is defined)
         else '' }}

- name: Decide whether a new release must be deployed
  ansible.builtin.set_fact:
    notes_archive_redeploy: >-
      {{ notes_archive_deployed_version is not
         match((notes_archive_version | regex_escape) ~ '$') }}

- name: Compute the timestamped release directory
  ansible.builtin.set_fact:
    notes_archive_release_dir: >-
      {{ notes_archive_releases_dir }}/{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}
  when: notes_archive_redeploy | bool

# CI built and e2e-tested exactly this tarball; the checksum published next to
# it proves the host runs that artifact and not a corrupted or swapped one.
- name: Download the release tarball and verify its checksum
  ansible.builtin.get_url:
    url: "{{ notes_archive_artifact_url }}"
    dest: "{{ notes_archive_base_dir }}/{{ notes_archive_artifact }}"
    checksum: "sha256:{{ notes_archive_artifact_url }}.sha256"
    mode: "0644"
  become: true
  become_user: "{{ notes_archive_user }}"
  when: notes_archive_redeploy | bool

- name: Create the release directory
  ansible.builtin.file:
    path: "{{ notes_archive_release_dir }}"
    state: directory
    owner: "{{ notes_archive_user }}"
    group: "{{ notes_archive_group }}"
    mode: "0755"
  when: notes_archive_redeploy | bool

# The tarball wraps everything in notes-archive-<X.Y.Z>/; strip it so the
# release dir holds build/ and node_modules/ directly. Skipped in check mode:
# neither the tarball nor the release dir exists then, so unarchive would fail.
- name: Unpack the release tarball
  ansible.builtin.unarchive:
    src: "{{ notes_archive_base_dir }}/{{ notes_archive_artifact }}"
    dest: "{{ notes_archive_release_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
  become: true
  become_user: "{{ notes_archive_user }}"
  when:
    - notes_archive_redeploy | bool
    - not ansible_check_mode

- name: Remove the downloaded tarball
  ansible.builtin.file:
    path: "{{ notes_archive_base_dir }}/{{ notes_archive_artifact }}"
    state: absent
  when: notes_archive_redeploy | bool

- name: Record the deployed version inside the release
  ansible.builtin.copy:
    content: "{{ notes_archive_version }}\n"
    dest: "{{ notes_archive_release_dir }}/.deployed_version"
    owner: "{{ notes_archive_user }}"
    group: "{{ notes_archive_group }}"
    mode: "0644"
  when: notes_archive_redeploy | bool
