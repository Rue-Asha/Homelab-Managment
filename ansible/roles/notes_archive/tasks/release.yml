---
# Atomic go-live: repoint `current` at the freshly built release in a single
# symlink swap. Rollback = repoint `current` at a previous release.
- name: Read the release that is active before this run
  ansible.builtin.stat:
    path: "{{ notes_archive_current_link }}"
  register: notes_archive_previous_link

# verify.yml rolls back to this if the new release fails its smoke check.
- name: Remember the release that is active before this run
  ansible.builtin.set_fact:
    notes_archive_previous_release: "{{ notes_archive_previous_link['stat']['lnk_target'] | default('', true) }}"

- name: Activate the new release
  ansible.builtin.file:
    src: "{{ notes_archive_release_dir }}"
    dest: "{{ notes_archive_current_link }}"
    state: link
    owner: "{{ notes_archive_user }}"
    group: "{{ notes_archive_group }}"
    force: true
  when: notes_archive_redeploy | bool
  notify: Restart notes-archive
