# SPDX-License-Identifier: MIT-0
---
# --- Service identity ---
notes_archive_user: notes-archive
notes_archive_group: notes-archive
notes_archive_service_name: notes-archive

# --- Source: the app repo's CI-built release tarball; the tag is the "image tag" ---
# The repo is public, so there is no deploy key. Assets are
# named without the tag's leading `v`.
notes_archive_releases_url: https://github.com/Rue-Asha/Notes-Archive/releases/download
notes_archive_version: v0.1.0              # release tag to deploy
notes_archive_artifact: "notes-archive-{{ notes_archive_version | regex_replace('^v', '') }}.tgz"
notes_archive_artifact_url: "{{ notes_archive_releases_url }}/{{ notes_archive_version }}/{{ notes_archive_artifact }}"

# --- On-host layout (see docs/party-games-webservice-architecture.md) ---
notes_archive_base_dir: /opt/notes-archive
notes_archive_releases_dir: "{{ notes_archive_base_dir }}/releases"
notes_archive_current_link: "{{ notes_archive_base_dir }}/current"
notes_archive_data_dir: /var/lib/notes-archive
notes_archive_config_dir: /etc/notes-archive
notes_archive_db_path: "{{ notes_archive_data_dir }}/notes-archive.db"
notes_archive_env_file: "{{ notes_archive_config_dir }}/env"

# --- Runtime ---
notes_archive_node_bin: /usr/bin/node
# Bind address for the adapter-node server. Keep on loopback so the backend is
# reachable only through the nginx reverse proxy, never directly on the LAN.
notes_archive_host: 127.0.0.1
notes_archive_port: 3000
notes_archive_node_env: production
# adapter-node assumes https unless told where the original protocol is; over
# plain http every form post then fails SvelteKit's origin check with a 403.
# The nginx role sends X-Forwarded-Proto.
notes_archive_protocol_header: x-forwarded-proto
# adapter-node's default request body limit is 512K; image uploads go up to 16 MB.
# Keep this below the host's nginx_client_max_body_size (18m) so nginx never answers 413 first.
notes_archive_body_size_limit: 17M

# --- Deploy ---
# No migrate step: the app applies its migrations on start and exits non-zero
# if one fails, so a bad migration surfaces as a failed restart.
notes_archive_keep_releases: 5

# --- Smoke check (tasks/verify.yml) ---
# Requested through nginx on the host, so proxy and app are checked together.
# /healthz answers 200 once the app has opened its database.
notes_archive_smoke_url: http://127.0.0.1/healthz
# The vhost matches on server_name; without a matching Host the request lands
# on nginx's default site instead of the app.
notes_archive_smoke_headers: {}
# Start-up migrations must finish inside retries x delay seconds.
notes_archive_smoke_retries: 10
notes_archive_smoke_delay: 3
