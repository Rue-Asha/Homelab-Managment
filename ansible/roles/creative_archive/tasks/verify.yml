---
# Smoke check on every run, deploy or not. The restart notified earlier has to
# have happened before the request proves anything about the new release.
- name: Restart the service now if this run changed it
  ansible.builtin.meta: flush_handlers

- name: Check the service through the reverse proxy, rolling back on failure
  block:
    - name: Request the service through the reverse proxy
      ansible.builtin.uri:
        url: "{{ creative_archive_smoke_url }}"
        headers: "{{ creative_archive_smoke_headers }}"
        status_code: "{{ range(200, 300) | list }}"
      register: creative_archive_smoke
      until: creative_archive_smoke is succeeded
      retries: "{{ creative_archive_smoke_retries }}"
      delay: "{{ creative_archive_smoke_delay }}"

  rescue:
    # Only a run that swapped `current` has something to undo.
    - name: Decide whether there is a release to roll back to
      ansible.builtin.set_fact:
        creative_archive_rolling_back: >-
          {{ (creative_archive_redeploy | bool) and (creative_archive_previous_release | default('') | length > 0) }}

    - name: Roll back to the release that was active before this run
      when: creative_archive_rolling_back | bool
      block:
        - name: Point current back at the previous release
          ansible.builtin.file:
            src: "{{ creative_archive_previous_release }}"
            dest: "{{ creative_archive_current_link }}"
            state: link
            owner: "{{ creative_archive_user }}"
            group: "{{ creative_archive_group }}"
            force: true

        - name: Restart the service on the previous release
          ansible.builtin.systemd:
            name: "{{ creative_archive_service_name }}"
            state: restarted

    - name: Fail the run
      ansible.builtin.fail:
        msg: >-
          {{ creative_archive_smoke_url }} did not answer 2xx within
          {{ creative_archive_smoke_retries }} x {{ creative_archive_smoke_delay }}s for
          {{ creative_archive_version }} ({{ creative_archive_release_dir | default(creative_archive_previous_release | default('no release')) }}).
          {{ ('Rolled back to ' ~ creative_archive_previous_release ~ '.') if creative_archive_rolling_back | bool
             else 'Nothing was rolled back: no previous release, or this run did not deploy one.' }}
