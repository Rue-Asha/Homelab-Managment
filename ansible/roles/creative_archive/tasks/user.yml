# SPDX-License-Identifier: MIT-0
---
- name: Ensure the creative-archive group exists
  ansible.builtin.group:
    name: "{{ creative_archive_group }}"
    system: true
    state: present

- name: Ensure the creative-archive service user exists
  ansible.builtin.user:
    name: "{{ creative_archive_user }}"
    group: "{{ creative_archive_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ creative_archive_data_dir }}"
    create_home: false
    state: present
