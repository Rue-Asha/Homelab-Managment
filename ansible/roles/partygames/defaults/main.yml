# SPDX-License-Identifier: MIT-0
---
# --- Service identity ---
partygames_user: partygames
partygames_group: partygames
partygames_service_name: partygames

# --- Source: the separate app repo; pinned version is the "image tag" ---
# Set partygames_repo_url in host_vars (e.g. git@github.com:you/partygames.git).
partygames_repo_url: ""
partygames_version: main                  # git tag / branch / commit to deploy

# --- Read-only deploy key for the (private) app repo; provide via vault ---
partygames_deploy_key: ""                 # private key contents; empty = skip

# --- On-host layout (see docs/party-games-webservice-architecture.md) ---
partygames_base_dir: /opt/partygames
partygames_releases_dir: "{{ partygames_base_dir }}/releases"
partygames_current_link: "{{ partygames_base_dir }}/current"
partygames_data_dir: /var/lib/partygames
partygames_config_dir: /etc/partygames
partygames_db_path: "{{ partygames_data_dir }}/app.db"
partygames_env_file: "{{ partygames_config_dir }}/env"
partygames_deploy_key_path: "{{ partygames_config_dir }}/deploy_key"

# --- Runtime ---
partygames_node_bin: /usr/bin/node
# Bind address for the adapter-node server. Keep on loopback so the backend is
# reachable only through the nginx reverse proxy, never directly on the LAN.
partygames_host: 127.0.0.1
partygames_port: 3000
partygames_node_env: production

# --- Build / deploy ---
partygames_build_command: "npm run build"
# Migration command runs in the release dir; override per app (Drizzle, etc.).
# Set to "" to disable.
partygames_migrate_command: "npm run db:migrate"
partygames_keep_releases: 5
