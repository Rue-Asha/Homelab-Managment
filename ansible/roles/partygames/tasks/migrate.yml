---
- name: Apply database migrations against the persistent SQLite database
  ansible.builtin.command:
    cmd: "{{ partygames_migrate_command }}"
    chdir: "{{ partygames_release_dir }}"
  become: true
  become_user: "{{ partygames_user }}"
  environment:
    NODE_ENV: "{{ partygames_node_env }}"
    DATABASE_PATH: "{{ partygames_db_path }}"
  changed_when: true
  when:
    - partygames_redeploy | bool
    - partygames_migrate_command | length > 0
