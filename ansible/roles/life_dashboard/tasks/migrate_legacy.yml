# SPDX-License-Identifier: MIT-0
---
# One-time, idempotent handover from the former `budget` service identity to the
# current `life-dashboard` one. The persistent SQLite database is the only
# irreplaceable artefact — releases are rebuilt and the env/deploy key are
# re-rendered from vault — so this task moves the database to the new data dir,
# re-owns it to the new service user, and retires the old unit and rebuildable
# dirs. Every step guards on the legacy layout still being present, so on an
# already-migrated (or fresh) host the whole file is a no-op.
#
# This runs BEFORE directories.yml on purpose: that task would otherwise create
# an empty new data dir and defeat the "new dir absent" guard, orphaning the DB.

- name: Stat the legacy data directory
  ansible.builtin.stat:
    path: "{{ life_dashboard_legacy_data_dir }}"
  register: life_dashboard_legacy_data

- name: Stat the new data directory
  ansible.builtin.stat:
    path: "{{ life_dashboard_data_dir }}"
  register: life_dashboard_new_data

- name: Decide whether a legacy migration is required
  ansible.builtin.set_fact:
    # Migrate only when the old data dir exists and the new one does not, so the
    # database is never moved on top of an existing one.
    life_dashboard_do_migrate: >-
      {{ life_dashboard_legacy_data.stat.exists
         and not life_dashboard_new_data.stat.exists }}

- name: Retire the legacy identity and relocate its data
  when: life_dashboard_do_migrate | bool
  block:
    - name: Stop and disable the legacy systemd unit
      ansible.builtin.systemd:
        name: "{{ life_dashboard_legacy_service_name }}"
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the legacy systemd unit file
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ life_dashboard_legacy_service_name }}.service"
        state: absent
      notify: Reload systemd

    - name: Ensure the new data directory's parent exists
      ansible.builtin.file:
        path: "{{ life_dashboard_data_dir | dirname }}"
        state: directory
        mode: "0755"

    - name: Move the persistent data directory to the new location
      ansible.builtin.command:
        cmd: "mv {{ life_dashboard_legacy_data_dir }} {{ life_dashboard_data_dir }}"
      args:
        creates: "{{ life_dashboard_data_dir }}"

    - name: Re-own the migrated data to the new service user
      ansible.builtin.file:
        path: "{{ life_dashboard_data_dir }}"
        owner: "{{ life_dashboard_user }}"
        group: "{{ life_dashboard_group }}"
        recurse: true

    - name: Remove the legacy base and config directories (rebuildable)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ life_dashboard_legacy_base_dir }}"
        - "{{ life_dashboard_legacy_config_dir }}"
