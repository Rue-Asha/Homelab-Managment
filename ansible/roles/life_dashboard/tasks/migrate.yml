---
- name: Apply database migrations against the persistent SQLite database
  ansible.builtin.command:
    cmd: "{{ life_dashboard_migrate_command }}"
    chdir: "{{ life_dashboard_release_dir }}"
  become: true
  become_user: "{{ life_dashboard_user }}"
  environment:
    NODE_ENV: "{{ life_dashboard_node_env }}"
    DATABASE_PATH: "{{ life_dashboard_db_path }}"
  changed_when: true
  when:
    - life_dashboard_redeploy | bool
    - life_dashboard_migrate_command | length > 0
