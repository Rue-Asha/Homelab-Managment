---
- name: Ensure the release and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ life_dashboard_user }}"
    group: "{{ life_dashboard_group }}"
    mode: "0755"
  loop:
    - "{{ life_dashboard_base_dir }}"
    - "{{ life_dashboard_releases_dir }}"
    - "{{ life_dashboard_data_dir }}"
    - "{{ life_dashboard_images_dir }}"

- name: Ensure the config directory exists
  ansible.builtin.file:
    path: "{{ life_dashboard_config_dir }}"
    state: directory
    owner: root
    group: "{{ life_dashboard_group }}"
    mode: "0750"
