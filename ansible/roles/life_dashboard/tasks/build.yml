---
# devDependencies are required to build (vite/svelte); install them here, then
# prune to production deps after the build. SQLite uses Node's built-in
# node:sqlite (Node >= 22), so no C toolchain is needed on the host.
- name: Install Node.js dependencies (clean install)
  community.general.npm:
    path: "{{ life_dashboard_release_dir }}"
    ci: true
  become: true
  become_user: "{{ life_dashboard_user }}"
  when: life_dashboard_redeploy | bool

- name: Build the application
  ansible.builtin.command:
    cmd: "{{ life_dashboard_build_command }}"
    chdir: "{{ life_dashboard_release_dir }}"
  become: true
  become_user: "{{ life_dashboard_user }}"
  changed_when: true
  when: life_dashboard_redeploy | bool

- name: Prune development dependencies from the release
  ansible.builtin.command:
    cmd: npm prune --omit=dev
    chdir: "{{ life_dashboard_release_dir }}"
  become: true
  become_user: "{{ life_dashboard_user }}"
  changed_when: true
  when: life_dashboard_redeploy | bool
