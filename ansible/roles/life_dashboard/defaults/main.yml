# SPDX-License-Identifier: MIT-0
---
# --- Service identity ---
life_dashboard_user: life-dashboard
life_dashboard_group: life-dashboard
life_dashboard_service_name: life-dashboard

# --- Source: the separate app repo; pinned version is the "image tag" ---
# Set life_dashboard_repo_url in host_vars (the Life-Management-Dashboard repo).
life_dashboard_repo_url: ""
life_dashboard_version: main           # git tag / branch / commit to deploy

# --- Read-only deploy key for the (private) app repo; provide via vault ---
life_dashboard_deploy_key: ""          # private key contents; empty = skip

# --- On-host layout (see docs/party-games-webservice-architecture.md) ---
life_dashboard_base_dir: /opt/life-dashboard
life_dashboard_releases_dir: "{{ life_dashboard_base_dir }}/releases"
life_dashboard_current_link: "{{ life_dashboard_base_dir }}/current"
life_dashboard_data_dir: /var/lib/life-dashboard
life_dashboard_config_dir: /etc/life-dashboard
life_dashboard_db_path: "{{ life_dashboard_data_dir }}/app.db"
# Uploaded images (module heroes, note covers, …) live on the filesystem, not
# in the DB. Keep this inside life_dashboard_data_dir so it survives redeploys,
# rides along with the legacy migration and is covered by ReadWritePaths.
life_dashboard_images_dir: "{{ life_dashboard_data_dir }}/images"
life_dashboard_env_file: "{{ life_dashboard_config_dir }}/env"
life_dashboard_deploy_key_path: "{{ life_dashboard_config_dir }}/deploy_key"

# --- Runtime ---
life_dashboard_node_bin: /usr/bin/node
# Bind address for the adapter-node server. Keep on loopback so the backend is
# reachable only through the nginx reverse proxy, never directly on the LAN.
life_dashboard_host: 127.0.0.1
life_dashboard_port: 3000
life_dashboard_node_env: production
# Browser-facing URL (scheme + host as typed into the browser, no trailing
# slash). Must match what nginx serves, or SvelteKit rejects form POSTs as
# cross-site. Defaults to plain HTTP on the host's LAN address.
life_dashboard_origin: "http://{{ ansible_host }}"

# --- Build / deploy ---
life_dashboard_build_command: "npm run build"
# Migration command runs in the release dir; override per app (Drizzle, etc.).
# Set to "" to disable.
life_dashboard_migrate_command: "npm run db:migrate"
life_dashboard_keep_releases: 5

# --- Legacy identity migration (from the former `budget` service) ---
# The service was first deployed under a `budget` identity: system user
# `budget`, on-host paths under /opt|/var/lib|/etc/budget, and a `budget.service`
# unit. When the Life-Management-Dashboard absorbed the Budgeting-Web-App the
# service kept that identity by inertia; this role renames it to
# `life-dashboard`. `migrate_legacy.yml` performs the one-time, idempotent
# handover on the first deploy — it relocates the persistent SQLite database to
# the new data dir, re-owns it, and retires the old systemd unit and (rebuildable)
# base/config dirs. Every step guards on the legacy artefact still being present,
# so on an already-migrated or fresh host the whole file is a no-op. Set
# life_dashboard_migrate_legacy: false once no host carries the old layout.
life_dashboard_migrate_legacy: true
life_dashboard_legacy_name: budget

# --- Container hostname ---
# The container was created as `budget01`, and proxmox_lxc only sets the
# hostname at creation time — so the running host kept the old name after the
# rename. hostname.yml fixes both the Proxmox config and the running OS; it
# guards on the current value, so it is a no-op once they match.
life_dashboard_manage_hostname: true
life_dashboard_hostname: "{{ inventory_hostname }}"
life_dashboard_domain: homelab.local
# CTID is the host's last IP octet (same rule the proxmox_guest group vars use).
life_dashboard_ctid: "{{ ansible_host.split('.')[-1] | int }}"
# Inventory name of the Proxmox node that runs the container — `pct` lives there.
life_dashboard_proxmox_host: proxmox1
life_dashboard_legacy_service_name: "{{ life_dashboard_legacy_name }}"
life_dashboard_legacy_user: "{{ life_dashboard_legacy_name }}"
life_dashboard_legacy_base_dir: "/opt/{{ life_dashboard_legacy_name }}"
life_dashboard_legacy_data_dir: "/var/lib/{{ life_dashboard_legacy_name }}"
life_dashboard_legacy_config_dir: "/etc/{{ life_dashboard_legacy_name }}"
