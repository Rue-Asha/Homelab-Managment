---
- name: Install the systemd unit for the runner
  ansible.builtin.template:
    src: github-runner.service.j2
    dest: "/etc/systemd/system/{{ github_runner_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart github-runner

- name: Ensure the runner is enabled and running
  ansible.builtin.systemd:
    name: "{{ github_runner_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: github_runner_registered | bool
