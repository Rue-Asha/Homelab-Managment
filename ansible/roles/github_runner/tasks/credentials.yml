---
- name: Ensure the runner's credential directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0700"
  loop:
    - "{{ github_runner_deploy_key | dirname }}"
    - "{{ github_runner_vault_password_file | dirname }}"

# Generated on the runner and never copied off it; only the public half leaves.
- name: Generate the deploy key pair
  ansible.builtin.command: >-
    ssh-keygen -q -t ed25519 -N '' -C '{{ github_runner_user }}@{{ inventory_hostname }}'
    -f {{ github_runner_deploy_key }}
  args:
    creates: "{{ github_runner_deploy_key }}"
  become: true
  become_user: "{{ github_runner_user }}"

- name: Fetch the deploy key's public half for guest_bootstrap
  ansible.builtin.fetch:
    src: "{{ github_runner_deploy_key }}.pub"
    dest: "{{ github_runner_public_key_dest | expanduser }}"
    flat: true

- name: Scan the guests' SSH host keys
  ansible.builtin.command: "ssh-keyscan -T 5 -t ed25519 {{ github_runner_ssh_targets | join(' ') }}"
  register: github_runner_keyscan
  changed_when: false
  check_mode: false
  when: github_runner_ssh_targets | length > 0

- name: Pin the guests' SSH host keys
  ansible.builtin.copy:
    content: "{{ github_runner_keyscan['stdout_lines'] | default([]) | sort | join('\n') }}\n"
    dest: "{{ github_runner_known_hosts }}"
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0644"

- name: Place the Ansible vault password file
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', github_runner_vault_password_src | expanduser) }}\n"
    dest: "{{ github_runner_vault_password_file }}"
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0600"
  no_log: true
