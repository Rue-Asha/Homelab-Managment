---
# Entry point: imports each logical task file in execution order.
- name: Ensure the runner user exists
  ansible.builtin.import_tasks: user.yml

- name: Install the runner and its Ansible
  ansible.builtin.import_tasks: install.yml

- name: Provision the deploy credentials
  ansible.builtin.import_tasks: credentials.yml

- name: Register the runner with the repository
  ansible.builtin.import_tasks: register.yml

- name: Configure the job environment
  ansible.builtin.import_tasks: environment.yml

- name: Manage the runner service
  ansible.builtin.import_tasks: service.yml
