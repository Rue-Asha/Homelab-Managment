---
- name: Read the installed terraform version
  ansible.builtin.command: /usr/local/bin/terraform version
  register: github_runner_terraform_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download terraform and verify its checksum
  ansible.builtin.get_url:
    url: "{{ github_runner_terraform_url }}"
    dest: "/usr/local/src/terraform_{{ github_runner_terraform_version }}_linux_amd64.zip"
    checksum: "sha256:{{ github_runner_terraform_sha256 }}"
    mode: "0644"
  register: github_runner_terraform_download

# unarchive has no way to compare against the installed binary, so the version
# check above decides. In check mode a fresh download never lands, so there is
# nothing to unpack.
- name: Unpack terraform
  ansible.builtin.unarchive:
    src: "/usr/local/src/terraform_{{ github_runner_terraform_version }}_linux_amd64.zip"
    dest: /usr/local/bin
    include: [terraform]
    remote_src: true
    mode: "0755"
  when:
    - "('Terraform v' ~ github_runner_terraform_version) not in github_runner_terraform_installed['stdout']"
    - not (ansible_check_mode and github_runner_terraform_download['changed'])

- name: Ensure the runner's config directory exists
  ansible.builtin.file:
    path: "{{ github_runner_terraform_env_file | dirname }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0700"

- name: Assert the runner's Terraform environment file exists on the controller
  ansible.builtin.assert:
    that: (github_runner_terraform_env_src | expanduser) is file
    fail_msg: >-
      {{ github_runner_terraform_env_src }} is missing on the controller. Create
      it from the template in terraform/README.md ("Runner credentials") with the
      runner's own PVE token, then rerun this playbook.
    quiet: true
  delegate_to: localhost
  become: false

- name: Place the runner's Terraform environment file
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', github_runner_terraform_env_src | expanduser) }}\n"
    dest: "{{ github_runner_terraform_env_file }}"
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0600"
  no_log: true
