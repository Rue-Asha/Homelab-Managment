---
- name: Create ansible user in container
  ansible.builtin.command: >
    pct exec {{ lxc_ctid }} -- sh -lc
    "id ansible >/dev/null 2>&1 || useradd -m -s /bin/bash ansible"
  when: lxc_start_after_create | default(true)
  delegate_to: "{{ proxmox_node_ip }}"
  become: true

- name: Set ansible user password in container
  ansible.builtin.command: "pct exec {{ lxc_ctid }} -- chpasswd"
  args:
    stdin: "ansible:{{ lxc_password }}"
  when: lxc_password is defined and (lxc_start_after_create | default(true))
  no_log: true
  delegate_to: "{{ proxmox_node_ip }}"
  become: true
