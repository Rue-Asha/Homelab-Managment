---
# Entry point: imports each logical task file in execution order.
- name: Ensure a Python interpreter is available
  ansible.builtin.import_tasks: python.yml

- name: Install bootstrap packages
  ansible.builtin.import_tasks: packages.yml

- name: Create the ansible account
  ansible.builtin.import_tasks: account.yml

- name: Configure sudo
  ansible.builtin.import_tasks: sudo.yml

- name: Authorise the SSH key
  ansible.builtin.import_tasks: ssh.yml
