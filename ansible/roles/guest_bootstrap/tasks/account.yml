---
# No password is set. Terraform seeds no root password either, and `pct enter`
# from the node is the console fallback -- see design D8.
- name: Ensure the ansible user exists
  ansible.builtin.user:
    name: "{{ guest_bootstrap_user }}"
    shell: "{{ guest_bootstrap_user_shell }}"
    home: "{{ guest_bootstrap_user_home }}"
    create_home: true
    state: present
