---
# One task with both keys: `exclusive` removes every key not in this call.
- name: Authorise the SSH keys for the ansible user
  ansible.posix.authorized_key:
    user: "{{ guest_bootstrap_user }}"
    key: "{{ ([guest_bootstrap_ssh_public_key] + guest_bootstrap_deploy_public_key) | join('\n') }}"
    state: present
    exclusive: true
  vars:
    guest_bootstrap_deploy_public_key: >-
      {{ [lookup('ansible.builtin.file', guest_bootstrap_deploy_public_key_path)]
         if (guest_bootstrap_authorize_deploy_key | bool)
            and (guest_bootstrap_deploy_public_key_path | expanduser) is file
         else [] }}
# Reachability as the ansible user is verified by a separate play in
# playbooks/02_BASE_CONFIGURATION/bootstrap.yml -- overriding ansible_user on a
# single task does not reliably re-establish the already-open SSH connection.
