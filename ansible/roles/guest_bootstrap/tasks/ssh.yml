---
# One task with every key: `exclusive` removes every key not in this call, which
# is also how the template's baked-in deploy key leaves runner01.
- name: Authorise the SSH keys for the ansible user
  ansible.posix.authorized_key:
    user: "{{ guest_bootstrap_user }}"
    key: "{{ guest_bootstrap_public_keys | join('\n') }}"
    state: present
    exclusive: true
  vars:
    guest_bootstrap_public_keys: >-
      {{ [guest_bootstrap_ssh_public_key | trim]
         + ([lookup('ansible.builtin.file', guest_bootstrap_deploy_public_key_path) | trim]
            if (guest_bootstrap_authorize_deploy_key | bool) else [])
         + guest_bootstrap_extra_public_keys }}
