---
# Runs before facts are gathered: a fresh guest may have no Python, and every
# other module needs one. `raw` is the only thing that works here, and this is
# the one place in the repo where it is justified.
- name: Ensure python3 is installed
  ansible.builtin.raw: >-
    test -x /usr/bin/python3 ||
    (apt-get update && apt-get install -y --no-install-recommends python3)
  register: guest_bootstrap_python3
  changed_when: "'Setting up python3' in guest_bootstrap_python3.stdout"

- name: Gather facts now that a Python interpreter exists
  ansible.builtin.setup:
