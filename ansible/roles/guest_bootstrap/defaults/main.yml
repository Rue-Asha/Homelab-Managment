---
# The unprivileged account every later playbook connects as. It exists already:
# the guest template creates it.
guest_bootstrap_user: ansible

# Keys authorised for that account, read from the repo: public keys are not
# secrets, and the template build script reads the same files.
guest_bootstrap_ssh_public_key: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../keys/guest_ed25519.pub') }}"
# The deploy runner's key. False on the runner itself: the key would give its
# jobs ansible's sudo there over loopback, and with it the power to drop the
# egress firewall.
guest_bootstrap_deploy_public_key_path: "{{ playbook_dir }}/../../keys/deploy_ed25519.pub"
guest_bootstrap_authorize_deploy_key: true
# Only for re-keying: authorised alongside the keys above for one run, so the
# old key keeps working until ansible.cfg points at the new one.
guest_bootstrap_extra_public_keys: []
