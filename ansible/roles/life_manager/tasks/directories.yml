---
- name: Ensure the release and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ life_manager_user }}"
    group: "{{ life_manager_group }}"
    mode: "0755"
  loop:
    - "{{ life_manager_base_dir }}"
    - "{{ life_manager_releases_dir }}"
    - "{{ life_manager_data_dir }}"

- name: Ensure the config directory exists
  ansible.builtin.file:
    path: "{{ life_manager_config_dir }}"
    state: directory
    owner: root
    group: "{{ life_manager_group }}"
    mode: "0750"
