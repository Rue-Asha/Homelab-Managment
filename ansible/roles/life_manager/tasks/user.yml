---
- name: Ensure the life-manager group exists
  ansible.builtin.group:
    name: "{{ life_manager_group }}"
    system: true
    state: present

- name: Ensure the life-manager service user exists
  ansible.builtin.user:
    name: "{{ life_manager_user }}"
    group: "{{ life_manager_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ life_manager_data_dir }}"
    create_home: false
    state: present
