---
# Idempotency: a release is only checked out, built, migrated and activated when
# the requested version differs from the one currently live. The live version is
# recorded in a marker file inside the active release.
- name: Read the currently deployed version marker
  ansible.builtin.slurp:
    src: "{{ life_manager_current_link }}/.deployed_version"
  register: life_manager_deployed_marker
  changed_when: false
  failed_when: false

- name: Determine the currently deployed version
  ansible.builtin.set_fact:
    life_manager_deployed_version: >-
      {{ (life_manager_deployed_marker['content'] | b64decode | trim)
         if (life_manager_deployed_marker['content'] is defined)
         else '' }}

- name: Decide whether a new release must be deployed
  ansible.builtin.set_fact:
    life_manager_redeploy: >-
      {{ life_manager_deployed_version is not
         match((life_manager_version | regex_escape) ~ '$') }}

- name: Compute the timestamped release directory
  ansible.builtin.set_fact:
    life_manager_release_dir: >-
      {{ life_manager_releases_dir }}/{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}
  when: life_manager_redeploy | bool

- name: Check out the pinned application version
  ansible.builtin.git:
    repo: "{{ life_manager_repo_url }}"
    dest: "{{ life_manager_release_dir }}"
    version: "{{ life_manager_version }}"
  become: true
  become_user: "{{ life_manager_user }}"
  when: life_manager_redeploy | bool

- name: Record the deployed version inside the release
  ansible.builtin.copy:
    content: "{{ life_manager_version }}\n"
    dest: "{{ life_manager_release_dir }}/.deployed_version"
    owner: "{{ life_manager_user }}"
    group: "{{ life_manager_group }}"
    mode: "0644"
  when: life_manager_redeploy | bool
