# SPDX-License-Identifier: MIT-0
---
# --- Service identity ---
life_manager_user: life-manager
life_manager_group: life-manager
life_manager_service_name: life-manager

# --- Source: the app repo's CI-built release tarball; the tag is the "image tag" ---
# The repo is public, so unlike partygames there is no deploy key. Assets are
# named without the tag's leading `v`.
life_manager_releases_url: https://github.com/Rue-Asha/Life-Manager/releases/download
life_manager_version: v0.2.0              # release tag to deploy
life_manager_artifact: "life-manager-{{ life_manager_version | regex_replace('^v', '') }}.tgz"
life_manager_artifact_url: "{{ life_manager_releases_url }}/{{ life_manager_version }}/{{ life_manager_artifact }}"

# --- On-host layout (see docs/party-games-webservice-architecture.md) ---
life_manager_base_dir: /opt/life-manager
life_manager_releases_dir: "{{ life_manager_base_dir }}/releases"
life_manager_current_link: "{{ life_manager_base_dir }}/current"
life_manager_data_dir: /var/lib/life-manager
life_manager_config_dir: /etc/life-manager
life_manager_db_path: "{{ life_manager_data_dir }}/life-manager.db"
life_manager_env_file: "{{ life_manager_config_dir }}/env"

# --- Runtime ---
life_manager_node_bin: /usr/bin/node
# Bind address for the adapter-node server. Keep on loopback so the backend is
# reachable only through the nginx reverse proxy, never directly on the LAN.
life_manager_host: 127.0.0.1
life_manager_port: 3000
life_manager_node_env: production
# adapter-node assumes https unless told where the original protocol is; over
# plain http every form post then fails SvelteKit's origin check with a 403.
# The nginx role sends X-Forwarded-Proto.
life_manager_protocol_header: x-forwarded-proto

# --- Deploy ---
# No migrate step: the app applies its migrations on start and exits non-zero
# if one fails, so a bad migration surfaces as a failed restart.
life_manager_keep_releases: 5

# --- Smoke check (tasks/verify.yml) ---
# Requested through nginx on the host, so proxy and app are checked together.
# /healthz answers 200 once the app has opened its database.
life_manager_smoke_url: http://127.0.0.1/healthz
# The vhost matches on server_name; without a matching Host the request lands
# on nginx's default site instead of the app.
life_manager_smoke_headers: {}
# Start-up migrations must finish inside retries x delay seconds.
life_manager_smoke_retries: 10
life_manager_smoke_delay: 3

# --- Proton Calendar sync (tasks/proton.yml) ---
# Installs proton-cli for the app's /sync page; the login stays manual, see the
# README. The sha256 comes from the release's checksums.txt, pinned like the
# check_runner tools.
life_manager_proton_enabled: false
life_manager_proton_version: v5.1.0
life_manager_proton_url: "https://github.com/roman-16/proton-cli/releases/download/{{ life_manager_proton_version }}/proton-cli_linux_amd64"
life_manager_proton_sha256: 51ac1dbb4041a6c5607a0853a7ef405737f497bd207d65e0957b9d4b0c0934d7
life_manager_proton_bin: /usr/local/bin/proton
life_manager_proton_profile: default
