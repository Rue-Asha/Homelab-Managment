---
- name: Assert the healthchecks.io ping URL is set
  ansible.builtin.assert:
    that:
      - sqlite_backup_ping_url | default('') | length > 0
    quiet: true
    fail_msg: >-
      sqlite_backup_ping_url is empty. Put the healthchecks.io ping URL into
      ansible/inventory/host_vars/proxmox1/vault.yml (ansible-vault) first.

- name: Collect every inventory host that has a backup registry entry
  ansible.builtin.set_fact:
    sqlite_backup_registered: >-
      {{ groups['all'] | map('extract', hostvars)
         | selectattr('sqlite_backups', 'defined')
         | map(attribute='inventory_hostname') | list }}

- name: Assert every registered host has a container ID
  ansible.builtin.assert:
    that: hostvars[item]['lxc_ctid'] is defined
    quiet: true
    fail_msg: >-
      {{ item }} has sqlite_backups but no lxc_ctid, so the node cannot reach
      it with pct. Register only LXC guests that Terraform provisions.
  loop: "{{ sqlite_backup_registered }}"

- name: Assert every registered database path ends in .db
  ansible.builtin.assert:
    that: hostvars[item]['sqlite_backups'].databases | select('match', '^.*\.db$') | list | length == hostvars[item]['sqlite_backups'].databases | length
    quiet: true
    fail_msg: >-
      {{ item }} registers a database path that does not end in .db; snapshot
      names and the restore lookup are derived from that suffix.
  loop: "{{ sqlite_backup_registered }}"

- name: Collect host and container ID of each registered guest
  ansible.builtin.set_fact:
    sqlite_backup_guests: "{{ (sqlite_backup_guests | default([])) + [item ~ ' ' ~ hostvars[item]['lxc_ctid']] }}"
  loop: "{{ sqlite_backup_registered }}"

- name: Show the guests the nightly job will cover
  ansible.builtin.debug:
    msg: "{{ sqlite_backup_guests | default([]) }}"
