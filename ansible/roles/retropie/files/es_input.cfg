<?xml version="1.0"?>
<inputList>
  <inputAction type="onfinish">
    <command>/opt/retropie/supplementary/emulationstation/scripts/inputconfiguration.sh</command>
  </inputAction>
  <inputConfig type="keyboard" deviceName="Keyboard" deviceGUID="-1">
    <!-- Movement -->
    <input name="up" type="key" id="1073741906" value="1"/> <!-- Up Arrow -->
    <input name="down" type="key" id="1073741905" value="1"/> <!-- Down Arrow -->
    <input name="left" type="key" id="1073741904" value="1"/> <!-- Left Arrow -->
    <input name="right" type="key" id="1073741903" value="1"/> <!-- Right Arrow -->

    <!-- Action Buttons -->
    <input name="a" type="key" id="100" value="1"/> <!-- Key: D -->
    <input name="b" type="key" id="120" value="1"/> <!-- Key: X -->
    <input name="x" type="key" id="119" value="1"/> <!-- Key: W -->
    <input name="y" type="key" id="97" value="1"/>  <!-- Key: A -->

    <!-- Navigation -->
    <input name="start" type="key" id="13" value="1"/> <!-- Key: Enter -->
    <input name="select" type="key" id="1073742053" value="1"/> <!-- Key: Right Shift -->

    <!-- Shoulders & Triggers -->
    <input name="leftshoulder" type="key" id="49" value="1"/> <!-- Key: 1 (L1) -->
    <input name="lefttrigger" type="key" id="50" value="1"/>  <!-- Key: 2 (L2) -->
    <input name="rightshoulder" type="key" id="51" value="1"/> <!-- Key: 3 (R1) -->
    <input name="righttrigger" type="key" id="52" value="1"/>  <!-- Key: 4 (R2) -->

    <!-- Paging / Hotkey -->
    <input name="pageup" type="key" id="113" value="1"/>   <!-- Key: Q -->
    <input name="pagedown" type="key" id="101" value="1"/> <!-- Key: E -->
    <input name="hotkeyenable" type="key" id="1073742053" value="1"/> <!-- Right Shift -->
  </inputConfig>
</inputList>
