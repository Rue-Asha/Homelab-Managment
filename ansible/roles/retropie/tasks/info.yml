---
- name: Store RetroPie access details
  ansible.builtin.template:
    src: SETUP_INFO.txt.j2
    dest: "{{ retropie_home }}/SETUP_INFO.txt"
    owner: "{{ retropie_user }}"
    mode: "0644"

- name: Display RetroPie installation information
  ansible.builtin.debug:
    msg:
      - "RetroPie installation completed!"
      - "SSH:  ssh {{ retropie_user }}@{{ ansible_host }}"
      - "Connect to the VM console in Proxmox to complete controller and ROM
        setup."
      - "See {{ retropie_home }}/SETUP_INFO.txt for next steps."
