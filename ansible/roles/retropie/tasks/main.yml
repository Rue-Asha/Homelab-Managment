---
# Entry point: imports each logical task file in execution order.
- name: Install packages
  ansible.builtin.import_tasks: packages.yml

- name: Create RetroPie user
  ansible.builtin.import_tasks: user.yml

- name: Install RetroPie
  ansible.builtin.import_tasks: install.yml

- name: Configure EmulationStation
  ansible.builtin.import_tasks: emulationstation.yml

- name: Configure autologin
  ansible.builtin.import_tasks: autologin.yml

- name: Write setup information
  ansible.builtin.import_tasks: info.yml
