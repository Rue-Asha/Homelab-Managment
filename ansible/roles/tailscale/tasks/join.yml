---
# Touches only the tailscale CLI, so scripts/tests/tailscale.sh can run this
# file alone against a stub.
- name: Read the Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

# A failed status query counts as not logged in: a key is then required, and
# a daemon that is really down fails loudly at `tailscale up`.
- name: Record the backend state
  ansible.builtin.set_fact:
    tailscale_join_state: >-
      {{ (tailscale_status['stdout'] | from_json)['BackendState'] | default('NoState', true)
         if tailscale_status['rc'] == 0 else 'NoState' }}

- name: Ensure a pre-auth key is given when the node is not logged in
  ansible.builtin.assert:
    that:
      - tailscale_authkey | trim | length > 0
    quiet: true
    fail_msg: >-
      {{ inventory_hostname }} is not logged in to the tailnet ({{ tailscale_join_state }})
      and the key prompt was left empty. Create a pre-auth key tagged
      {{ tailscale_advertise_tags | join(', ') }} in the admin console
      (Settings -> Keys -> Generate auth key, Tags) and rerun, pasting it at the prompt.
  when: tailscale_join_state in ['NeedsLogin', 'NoState']

# A Stopped node (after `tailscale down`) is still logged in: same flags, no key.
# The error is surfaced by the next task, since no_log would censor it here.
- name: Bring the node up as a subnet router
  ansible.builtin.command:
    argv: "{{ ['tailscale', 'up'] + tailscale_join_key_args + tailscale_join_up_flags }}"
  vars:
    tailscale_join_key_args: >-
      {{ ['--auth-key=' ~ (tailscale_authkey | trim)]
         if tailscale_join_state in ['NeedsLogin', 'NoState'] else [] }}
    tailscale_join_up_flags:
      - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
      - "--advertise-tags={{ tailscale_advertise_tags | join(',') }}"
      - "--accept-dns={{ tailscale_accept_dns | bool | ternary('true', 'false') }}"
  register: tailscale_up
  changed_when: true
  failed_when: false
  no_log: true
  when: tailscale_join_state in ['NeedsLogin', 'NoState', 'Stopped']

- name: Fail when tailscale up was rejected
  ansible.builtin.fail:
    msg: "tailscale up failed (rc {{ tailscale_up['rc'] }}): {{ tailscale_up['stderr'] }}"
  when: tailscale_up['rc'] | default(0) != 0

- name: Read the running node's prefs
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false
  check_mode: false
  when: tailscale_join_state not in ['NeedsLogin', 'NoState', 'Stopped']

# Tags are left alone: changing them needs a fresh key and --force-reauth.
- name: Converge advertised routes and DNS without re-authenticating
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
      - "--accept-dns={{ tailscale_accept_dns | bool | ternary('true', 'false') }}"
  changed_when: true
  vars:
    tailscale_join_prefs: "{{ tailscale_prefs['stdout'] | from_json }}"
  when:
    - tailscale_prefs is not skipped
    - >-
      (tailscale_join_prefs['AdvertiseRoutes'] | default([], true) | symmetric_difference(tailscale_advertise_routes) | length > 0)
      or ((tailscale_join_prefs['CorpDNS'] | default(true)) | bool) != (tailscale_accept_dns | bool)
