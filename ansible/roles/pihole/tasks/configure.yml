---
- name: Validate Pi-hole web username setting
  ansible.builtin.assert:
    that:
      - pihole_default_user == "admin"
    fail_msg: "Pi-hole only supports the web user 'admin'. Set pihole_default_user to 'admin'."

- name: Set Pi-hole web admin password
  ansible.builtin.command: "pihole -a -p {{ pihole_password }}"
  no_log: true
  when: pihole_password is defined and pihole_password | length > 0
