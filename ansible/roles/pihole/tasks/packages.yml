---
# git is needed before the installer's own dependency step; dig is for verify.yml.
- name: Install the packages the role itself uses
  ansible.builtin.apt:
    name:
      - bind9-dnsutils
      - ca-certificates
      - curl
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check that the pinned core tag exists upstream
  ansible.builtin.command:
    argv:
      - git
      - ls-remote
      - --exit-code
      - --tags
      - "{{ pihole_core_repo }}"
      - "refs/tags/{{ pihole_version }}"
  when: pihole_install_needed | bool
  changed_when: false
  check_mode: false
