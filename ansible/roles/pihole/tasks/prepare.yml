# SPDX-License-Identifier: MIT-0
---
- name: Create Pi-hole installation directory
  ansible.builtin.file:
    path: "{{ pihole_install_dir }}"
    state: directory
    mode: "0755"

- name: Ensure /etc/pihole exists
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    mode: "0755"

- name: Pre-populate setupVars.conf to skip interactive prompts
  ansible.builtin.template:
    src: setupVars.conf.j2
    dest: /etc/pihole/setupVars.conf
    mode: "0644"
