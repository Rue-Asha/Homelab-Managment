# SPDX-License-Identifier: MIT-0
---
# --- Service identity ---
rues_cooking_hub_user: rues-cooking-hub
rues_cooking_hub_group: rues-cooking-hub
rues_cooking_hub_service_name: rues-cooking-hub

# --- Source: the app repo's CI-built release tarball; the tag is the "image tag" ---
# The repo is public, so there is no deploy key. Assets are
# named without the tag's leading `v`.
rues_cooking_hub_releases_url: https://github.com/Rue-Asha/Rues-Cooking-Hub/releases/download
rues_cooking_hub_version: v0.1.0              # release tag to deploy
rues_cooking_hub_artifact: "rues-cooking-hub-{{ rues_cooking_hub_version | regex_replace('^v', '') }}.tgz"
rues_cooking_hub_artifact_url: "{{ rues_cooking_hub_releases_url }}/{{ rues_cooking_hub_version }}/{{ rues_cooking_hub_artifact }}"

# --- On-host layout (see docs/party-games-webservice-architecture.md) ---
rues_cooking_hub_base_dir: /opt/rues-cooking-hub
rues_cooking_hub_releases_dir: "{{ rues_cooking_hub_base_dir }}/releases"
rues_cooking_hub_current_link: "{{ rues_cooking_hub_base_dir }}/current"
rues_cooking_hub_data_dir: /var/lib/rues-cooking-hub
rues_cooking_hub_config_dir: /etc/rues-cooking-hub
rues_cooking_hub_db_path: "{{ rues_cooking_hub_data_dir }}/rues-cooking-hub.db"
rues_cooking_hub_env_file: "{{ rues_cooking_hub_config_dir }}/env"

# --- Runtime ---
rues_cooking_hub_node_bin: /usr/bin/node
# Bind address for the adapter-node server. Keep on loopback so the backend is
# reachable only through the nginx reverse proxy, never directly on the LAN.
rues_cooking_hub_host: 127.0.0.1
rues_cooking_hub_port: 3000
rues_cooking_hub_node_env: production
# adapter-node assumes https unless told where the original protocol is; over
# plain http every form post then fails SvelteKit's origin check with a 403.
# The nginx role sends X-Forwarded-Proto.
rues_cooking_hub_protocol_header: x-forwarded-proto
# adapter-node's default request body limit is 512K; recipe photos go up to 15 MB.
# Keep this <= the host's nginx_client_max_body_size so nginx never answers 413 first.
rues_cooking_hub_body_size_limit: 16M

# --- Deploy ---
# No migrate step: the app applies its migrations on start and exits non-zero
# if one fails, so a bad migration surfaces as a failed restart.
rues_cooking_hub_keep_releases: 5

# --- Smoke check (tasks/verify.yml) ---
# Requested through nginx on the host, so proxy and app are checked together.
# /healthz answers 200 once the app has opened its database.
rues_cooking_hub_smoke_url: http://127.0.0.1/healthz
# The vhost matches on server_name; without a matching Host the request lands
# on nginx's default site instead of the app.
rues_cooking_hub_smoke_headers: {}
# Start-up migrations must finish inside retries x delay seconds.
rues_cooking_hub_smoke_retries: 10
rues_cooking_hub_smoke_delay: 3
