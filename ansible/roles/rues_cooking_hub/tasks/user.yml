---
- name: Ensure the rues-cooking-hub group exists
  ansible.builtin.group:
    name: "{{ rues_cooking_hub_group }}"
    system: true
    state: present

- name: Ensure the rues-cooking-hub service user exists
  ansible.builtin.user:
    name: "{{ rues_cooking_hub_user }}"
    group: "{{ rues_cooking_hub_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ rues_cooking_hub_data_dir }}"
    create_home: false
    state: present
