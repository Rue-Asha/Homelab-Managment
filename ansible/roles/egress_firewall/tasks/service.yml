---
- name: Ensure nftables is enabled and running
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

# A role failing later in the play would otherwise drop the queued reload, and
# the next run sees an unchanged file and never notifies again.
- name: Load a changed ruleset before anything else runs
  ansible.builtin.meta: flush_handlers

- name: Check the egress table is live
  ansible.builtin.command: nft list table inet egress_firewall
  register: egress_firewall_live
  changed_when: false
  failed_when: false
  check_mode: false

- name: Load the ruleset when the live one is missing
  ansible.builtin.systemd:
    name: nftables
    state: restarted
  when: egress_firewall_live.rc != 0
