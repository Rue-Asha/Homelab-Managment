---
# Entry point: imports each logical task file in execution order.
- name: Check the instance list and each repository's fork-PR policy
  ansible.builtin.import_tasks: preflight.yml

- name: Remove the single-instance runner this layout replaces
  ansible.builtin.import_tasks: legacy.yml

- name: Ensure the instance users exist
  ansible.builtin.import_tasks: user.yml

- name: Install the pinned toolchain
  ansible.builtin.import_tasks: toolchain.yml

- name: Install the runners
  ansible.builtin.import_tasks: install.yml

- name: Register the runners with their repositories
  ansible.builtin.import_tasks: register.yml

- name: Configure the job environments
  ansible.builtin.import_tasks: environment.yml

- name: Manage the runner services
  ansible.builtin.import_tasks: service.yml
