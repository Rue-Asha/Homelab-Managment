# The merge verdict for main. Runs the same scripts/proof.sh the git hook runs,
# in --all mode, from a clean checkout; this file installs tools and owns no
# check list of its own.
#
# Nothing here reaches the Proxmox node or a guest, and no secret is
# configured: Terraform initialises without a backend and Ansible only parses
# and lints.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    name: proof
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install ansible-core, ansible-lint and checkov
        run: pip install -r ci/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/collections/requirements.yml

      # ansible.cfg points at a vault password file that only exists on the
      # workstation. No vault-encrypted file is tracked today; when one is,
      # syntax-check will fail to decrypt it with this dummy and this step needs
      # revisiting.
      - name: Provide a dummy vault password file
        run: |
          echo dummy > "$RUNNER_TEMP/vault_pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault_pass" >> "$GITHUB_ENV"

      # tflint evaluates locals, and containers.tf reads the public key seeded
      # into guests from the workstation's ~/.ssh.
      - name: Provide a placeholder SSH public key
        run: |
          echo "ssh-ed25519 AAAA placeholder" > "$RUNNER_TEMP/placeholder.pub"
          echo "TF_VAR_ssh_public_key_path=$RUNNER_TEMP/placeholder.pub" >> "$GITHUB_ENV"

      - name: Run proof
        run: scripts/proof.sh --all

  security-baseline:
    uses: Rue-Asha/ci/.github/workflows/security-baseline.yml@aab9824cdb27d4d86203a5d7b4785d95f8549cbc # v1.0.0
