---
# Environment-specific LXC settings
# (role-baseline defaults live in roles/proxmox_lxc/defaults/main.yml)
lxc_rootfs_storage: local-lvm

# Network settings
lxc_bridge: vmbr0
lxc_cidr: 24
lxc_gateway: 192.168.0.1

# LXC template and per-host identity
lxc_template_storage: local
lxc_template_file: debian-12-standard_12.12-1_amd64.tar.zst
lxc_ostemplate: "{{ lxc_template_storage }}:vztmpl/{{ lxc_template_file }}"
lxc_ctid: "{{ id }}"
# lxc_password: Define Password per Host in the corresponding host_var vault, if not, no password will be set
lxc_ssh_public_key: "{{ default_ssh_public_key }}"
