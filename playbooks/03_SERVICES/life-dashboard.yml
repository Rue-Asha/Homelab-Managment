---
- name: Deploy the Life-Management-Dashboard web service
  hosts: life_dashboard
  become: true
  gather_facts: true
  roles:
    - common          # base host config (02 layer)
    - nodejs          # Node.js runtime
    - life-dashboard  # service: checkout, build, release, systemd unit
    - nginx           # reverse proxy (:80 -> 127.0.0.1:{{ life_dashboard_port }})
