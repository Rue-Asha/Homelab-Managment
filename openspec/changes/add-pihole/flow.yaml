triage: "feature — new guest, new role and playbook, LAN-wide DNS. Appetite: two evenings."
base: main
gate0: 2026-10-05
gate1: 2026-10-05
learnings:
  - "Fixture tests that run git → unset GIT_DIR, GIT_INDEX_FILE, GIT_WORK_TREE first (weil: the pre-commit hook leaks them, fixture commits landed on the real branch and core.bare flipped to true in the main repo)"
  - "terraform validate fails in a fresh worktree → rm the ignored .terraform cache and re-run proof (weil: cache disagrees with the committed lock file; proof's init also rewrites .terraform.lock.hcl, restore it with git checkout)"
  - "Playbook unit that depends on a role built in the same wave → put them in one unit or in separate waves (weil: the pre-commit hook syntax-checks the playbook, so U5 could not commit until U4 was merged)"
  - "Ansible assert with a user-facing fail_msg → no no_log on it (weil: no_log censors the failed result including fail_msg, so the operator sees 'censored' instead of which variable is missing)"
