triage: "feature + live — new backup capability for every service guest plus a node-side job on proxmox1; first apply on real hosts. Appetite: two sessions."
base: main
track: feature
live: true
gate0: 2026-10-10
gate1: 2026-10-10
gate1_replan: 2026-10-11
scope_change: "2026-10-11 — S6 alerting removed (Rue)"
learnings:
  - "Explore recommending an external service (account, SaaS) for a small homelab → ask Rue whether an extra external account is acceptable before recommending it; offer the no-alerting option explicitly. (weil: healthchecks.io was chosen as the recommended option at explore, then cut during build because Rue found alerting not worth it for few services) [2026-10-11 · sqlite-backups]"
  - "Fixer mutation checks → only in a scratch copy outside the worktree, never mutate-in-place with backup/restore via cp, and no background processes left at return (a round-1 fixer's in-place mutation script hung 15 min on an aliased cp -i while restoring a mutant; had it resumed, it would have mutated the tree under the next verifier; orchestrator killed it by PID)"
  - "zsh in agent shells: `git show $rev:path` hits the `:s` history modifier (bad substitution) → write `${rev}:path` (orchestrator)"
  - "proof.sh --all rewrites terraform/.terraform.lock.hcl in every flow worktree, and reverting it with git checkout breaks the next terraform validate (provider not cached) → leave the drift unstaged, or rm the ignored .terraform cache before re-running proof (U2, U3, orchestrator; recurrence of deploy-new-guests)"
  - "flow-unit drop uses branch -d, which fails when the primary checkout is on another branch → flow-unit should check merge-base --is-ancestor against flow/<change> and use -D itself (recurred in this change)"
  - "proof.sh --all lints and syntax-checks only tracked files → builders git add a new playbook/role before the proof run, else it passes unchecked (U4)"
  - "Gate 1 correction: Rue wanted pre-restore snapshots rotated (newest 10), the planner had left them unbounded → planner: every snapshot class a design creates gets a retention rule"
  - "ansible --check skips command/shell tasks, so --check dry runs on live hosts prove almost nothing for script-driven roles → planner: put the real proof in offline fixture tests and say plainly at Gate 1 that live behaviour is only proven after merge"
  - "proof.sh prints only PASS: <sensor> and hides per-scenario ok lines → verifier (layer 2) must run scripts/tests/*.sh directly to map scenarios to tests (planner)"
  - "a trailing plain `ls` hung a main-session Bash call for 120s after the writes had succeeded → use `command ls` in agent shells (alias, like rm/mv/cp)"
