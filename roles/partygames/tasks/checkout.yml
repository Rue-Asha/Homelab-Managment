---
# Idempotency: a release is only checked out, built, migrated and activated when
# the requested version differs from the one currently live. The live version is
# recorded in a marker file inside the active release.
- name: Read the currently deployed version marker
  ansible.builtin.slurp:
    src: "{{ partygames_current_link }}/.deployed_version"
  register: partygames_deployed_marker
  changed_when: false
  failed_when: false

- name: Determine the currently deployed version
  ansible.builtin.set_fact:
    partygames_deployed_version: >-
      {{ (partygames_deployed_marker['content'] | b64decode | trim)
         if (partygames_deployed_marker['content'] is defined)
         else '' }}

- name: Decide whether a new release must be deployed
  ansible.builtin.set_fact:
    partygames_redeploy: >-
      {{ partygames_deployed_version is not
         match((partygames_version | regex_escape) ~ '$') }}

- name: Compute the timestamped release directory
  ansible.builtin.set_fact:
    partygames_release_dir: >-
      {{ partygames_releases_dir }}/{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}
  when: partygames_redeploy | bool

- name: Check out the pinned application version
  ansible.builtin.git:
    repo: "{{ partygames_repo_url }}"
    dest: "{{ partygames_release_dir }}"
    version: "{{ partygames_version }}"
    # SSH deploy key + relaxed host-key check apply only to a private repo over
    # SSH; for a public HTTPS clone both are omitted.
    key_file: "{{ partygames_deploy_key_path if (partygames_deploy_key | length > 0) else omit }}"
    ssh_opts: "{{ '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' if (partygames_deploy_key | length > 0) else omit }}"
  become: true
  become_user: "{{ partygames_user }}"
  when: partygames_redeploy | bool

- name: Record the deployed version inside the release
  ansible.builtin.copy:
    content: "{{ partygames_version }}\n"
    dest: "{{ partygames_release_dir }}/.deployed_version"
    owner: "{{ partygames_user }}"
    group: "{{ partygames_group }}"
    mode: "0644"
  when: partygames_redeploy | bool
