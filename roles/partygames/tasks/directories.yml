---
- name: Ensure the release and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ partygames_user }}"
    group: "{{ partygames_group }}"
    mode: "0755"
  loop:
    - "{{ partygames_base_dir }}"
    - "{{ partygames_releases_dir }}"
    - "{{ partygames_data_dir }}"

- name: Ensure the config directory exists
  ansible.builtin.file:
    path: "{{ partygames_config_dir }}"
    state: directory
    owner: root
    group: "{{ partygames_group }}"
    mode: "0750"
