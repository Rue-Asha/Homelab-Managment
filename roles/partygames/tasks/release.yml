---
# Atomic go-live: repoint `current` at the freshly built release in a single
# symlink swap. Rollback = repoint `current` at a previous release.
- name: Activate the new release
  ansible.builtin.file:
    src: "{{ partygames_release_dir }}"
    dest: "{{ partygames_current_link }}"
    state: link
    owner: "{{ partygames_user }}"
    group: "{{ partygames_group }}"
    force: true
  when: partygames_redeploy | bool
  notify: Restart partygames
