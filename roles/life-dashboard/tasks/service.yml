---
- name: Install the systemd unit for the service
  ansible.builtin.template:
    src: life-dashboard.service.j2
    dest: "/etc/systemd/system/{{ life_dashboard_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart life-dashboard

- name: Ensure the service is enabled and running
  ansible.builtin.systemd:
    name: "{{ life_dashboard_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
