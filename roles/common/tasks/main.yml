---
# Entry point: imports each logical task file in execution order.
- name: Install base packages
  ansible.builtin.import_tasks: packages.yml

- name: Ensure the host timezone is set
  ansible.builtin.import_tasks: timezone.yml

- name: Harden SSH
  ansible.builtin.import_tasks: harden_ssh.yml
