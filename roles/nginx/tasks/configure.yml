---
- name: Deploy global nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    validate: nginx -t -c %s
  notify: Reload nginx

- name: Deploy reverse-proxy vhost
  ansible.builtin.template:
    src: reverse_proxy.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_vhost_filename }}"
    owner: root
    group: root
    mode: "0644"
  when: nginx_reverse_proxy_enabled | bool
  notify: Reload nginx

- name: Enable reverse-proxy vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_vhost_filename }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_vhost_filename }}"
    state: link
  when: nginx_reverse_proxy_enabled | bool
  notify: Reload nginx

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: nginx_remove_default_site | bool
  notify: Reload nginx

- name: Validate full nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
