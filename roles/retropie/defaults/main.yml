---
# Local user that owns the RetroPie install and auto-logs into tty1
retropie_user: PiGamer
retropie_home: "/home/{{ retropie_user }}"

# Where the RetroPie-Setup repo is cloned
retropie_install_dir: "{{ retropie_home }}/RetroPie-Setup"
retropie_repo: https://github.com/RetroPie/RetroPie-Setup.git

# basic_install can take 30-60 minutes
retropie_install_timeout: 3600

# Packages required by RetroPie-Setup
retropie_dependencies:
  - acl
  - git
  - dialog
  - unzip
  - libsdl2-2.0-0
  - xmlstarlet
  - python3
  - python3-pip
