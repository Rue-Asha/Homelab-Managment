---
- name: Ensure getty@tty1 drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: "0755"
  tags: config

- name: Configure systemd autologin for PiGamer on tty1
  ansible.builtin.template:
    src: autologin.conf.j2
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    mode: "0644"
  notify: Reload systemd
  tags: config

- name: Launch EmulationStation on tty1 login
  ansible.builtin.copy:
    src: bash_profile
    dest: "{{ retropie_home }}/.bash_profile"
    owner: "{{ retropie_user }}"
    group: "{{ retropie_user }}"
    mode: "0644"
  tags: config

- name: Remove legacy .bashrc autostart line (superseded by .bash_profile)
  ansible.builtin.lineinfile:
    path: "{{ retropie_home }}/.bashrc"
    line: '[ -n "$SSH_CONNECTION" ] || emulationstation'
    state: absent
  tags: config
