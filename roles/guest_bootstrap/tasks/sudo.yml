---
# `copy` with visudo validation rather than lineinfile: a malformed sudoers
# drop-in locks the account out of privilege escalation, and validate makes
# that unrepresentable.
- name: Grant the ansible user passwordless sudo
  ansible.builtin.copy:
    content: "{{ guest_bootstrap_user }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "{{ guest_bootstrap_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -csf %s
