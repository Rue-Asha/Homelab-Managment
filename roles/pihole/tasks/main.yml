---
# Entry point: imports each logical task file in execution order.
- name: Install packages
  ansible.builtin.import_tasks: packages.yml

- name: Prepare Pi-hole configuration
  ansible.builtin.import_tasks: prepare.yml

- name: Install Pi-hole
  ansible.builtin.import_tasks: install.yml

- name: Configure Pi-hole
  ansible.builtin.import_tasks: configure.yml

- name: Write setup information
  ansible.builtin.import_tasks: info.yml

- name: Enable Pi-hole services
  ansible.builtin.import_tasks: service.yml
