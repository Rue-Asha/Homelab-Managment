---
- name: Display Pi-hole installation information
  ansible.builtin.debug:
    msg:
      - "Pi-hole installation completed!"
      - "Web Interface: http://{{ pihole_ipv4 }}/admin"
      - "DNS Server IP: {{ pihole_ipv4 }}"
      - "Username: {{ pihole_default_user }}"
      - "Password has been set from pihole_password."

- name: Get Pi-hole admin password (if available)
  ansible.builtin.shell:
    cmd: set -o pipefail; grep WEBPASSWORD /etc/pihole/setupVars.conf | cut -d'=' -f2
    executable: /bin/bash
  register: pihole_password_check
  failed_when: false
  no_log: true

- name: Store Pi-hole access details
  ansible.builtin.template:
    src: SETUP_INFO.txt.j2
    dest: "{{ pihole_install_dir }}/SETUP_INFO.txt"
    mode: "0644"
