---
# Network interface inside the container
pihole_interface: eth0

# IP addresses derived from gathered facts (requires gather_facts: yes)
pihole_ipv4: "{{ ansible_facts['default_ipv4']['address'] }}"
pihole_ipv6: "{{ ansible_facts['default_ipv6']['address'] | default('') }}"

# Installer behavior toggles (currently hardcoded in the shell task; kept
# here so a future patch can wire them through as env vars)
pihole_skip_os_check: true
pihole_skip_docker_check: true
pihole_unattended_install: true

# Where the role drops install artifacts (SETUP_INFO.txt, etc.)
pihole_install_dir: /opt/pihole

# Services to enable after install
# (Pi-hole v6 uses its own embedded web server, so no lighttpd)
pihole_services:
  - pihole-FTL

# Timeouts (seconds)
pihole_install_timeout: 900
pihole_wait_timeout: 60

# Web admin user — Pi-hole only supports "admin"; the role asserts this.
pihole_default_user: admin
